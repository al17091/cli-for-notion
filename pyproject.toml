[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-for-notion"
version = "1.0.0"
description = "A fast, lightweight, zero-dependency CLI for Notion."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Koki Higashi" }
]
dependencies = []

[project.scripts]
notion = "cli_for_notion.cli:main"
ntn = "cli_for_notion.cli:main"
cli-for-notion = "cli_for_notion.cli:main"

[tool.setuptools.packages.find]
include = ["cli_for_notion*"]
